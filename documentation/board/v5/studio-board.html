<title>LifeLink Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* ===== Tokens: dark first (review work), paper light theme. Every colour on the page is one of these. ===== */
:root {
  --bg: #130b0d; --surface: #1c1214; --raised: #261819; --sunken: #0f0809; --line: #3a2629; --line-strong: #56393d;
  --ink: #f4ebe6; --muted: #c4aeaa; --faint: #a48c88;
  --burgundy: #9b2335; --burgundy-hover: #b22b40; --on-burgundy: #ffffff; --burgundy-ink: #f2bec4;
  --royal: #94b4f2; --ok: #74c896; --warn: #e6b366; --fail: #ec8089;
  --video: #000000; --on-video: #f4ebe6; --scrim: rgba(0,0,0,.55); --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.25);
  --ui: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif; --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --nav-w: 240px; --gut: max(16px, min(4vw, 44px)); --r: 12px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #f3f0e8; --surface: #fbf9f4; --raised: #ece6da; --sunken: #e9e3d7; --line: #ddd2c1; --line-strong: #c4b49e;
  --ink: #2c0a0d; --muted: #6b4f51; --faint: #7a6260;
  --burgundy: #500002; --burgundy-hover: #6d0a10; --on-burgundy: #ffffff; --burgundy-ink: #6b0a12;
  --royal: #2c53ad; --ok: #23683f; --warn: #8a5208; --fail: #a3313b;
  --scrim: rgba(20,4,6,.5); --shadow: 0 1px 2px rgba(60,20,20,.08), 0 8px 24px rgba(60,20,20,.08); color-scheme: light } }
:root[data-theme="light"] {
  --bg: #f3f0e8; --surface: #fbf9f4; --raised: #ece6da; --sunken: #e9e3d7; --line: #ddd2c1; --line-strong: #c4b49e;
  --ink: #2c0a0d; --muted: #6b4f51; --faint: #7a6260;
  --burgundy: #500002; --burgundy-hover: #6d0a10; --on-burgundy: #ffffff; --burgundy-ink: #6b0a12;
  --royal: #2c53ad; --ok: #23683f; --warn: #8a5208; --fail: #a3313b;
  --scrim: rgba(20,4,6,.5); --shadow: 0 1px 2px rgba(60,20,20,.08), 0 8px 24px rgba(60,20,20,.08); color-scheme: light }

/* ===== Base ===== */
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--ui); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--royal); }
.num, .tc { font-variant-numeric: tabular-nums; }
.tc { font-family: var(--mono); }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--royal); outline-offset: 2px; border-radius: 6px; }
svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 16px; height: 16px; }
h1 { margin: 0; font-size: clamp(24px, 2.4vw, 30px); line-height: 1.2; font-weight: 600; letter-spacing: -.01em; text-wrap: balance; }
h2 { margin: 0 0 14px; font-size: 12.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); font-weight: 700; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
h3 { margin: 0; font-size: 17px; font-weight: 600; line-height: 1.35; }
p { margin: 0; }
.meta { font-size: 12.5px; color: var(--muted); }
.muted { color: var(--muted); }
.ok { color: var(--ok); } .fail { color: var(--fail); } .warn { color: var(--warn); } .run { color: var(--royal); }

/* ===== Shell: sidebar + main ===== */
.app { display: grid; grid-template-columns: var(--nav-w) minmax(0, 1fr); min-height: 100vh; }
.app.collapsed { --nav-w: 72px; }
nav.side { position: sticky; top: 0; height: 100vh; align-self: start; border-right: 1px solid var(--line); background: var(--surface);
  display: flex; flex-direction: column; padding: max(18px, env(safe-area-inset-top, 0px)) 12px 14px max(12px, env(safe-area-inset-left, 0px)); gap: 4px; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 18px; color: var(--burgundy-ink); font-weight: 700; letter-spacing: .02em; font-size: 16px; }
.brand .mark { width: 32px; height: 32px; border-radius: 9px; background: var(--burgundy); color: var(--on-burgundy); display: grid; place-items: center; font-size: 15px; flex: none; }
.brand small { display: block; font-weight: 600; color: var(--faint); font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; }
.grp { font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); font-weight: 700; padding: 14px 10px 6px; }
nav.side a { position: relative; display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 9px; color: var(--muted); text-decoration: none; font-size: 14.5px; font-weight: 500; min-height: 40px; }
nav.side a:hover { color: var(--ink); background: var(--raised); }
nav.side a[aria-current="page"] { color: var(--ink); background: var(--raised); font-weight: 600; }
nav.side a[aria-current="page"]::before { content: ""; position: absolute; left: -12px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--burgundy-ink); }
nav.side a[aria-current="page"] svg { color: var(--burgundy-ink); }
nav.side .lbl { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.count { min-width: 22px; height: 20px; padding: 0 6px; border-radius: 10px; background: color-mix(in srgb, var(--burgundy-ink) 16%, transparent); color: var(--burgundy-ink); font-size: 12px; font-weight: 700; display: inline-grid; place-items: center; }
.count.f { background: color-mix(in srgb, var(--fail) 16%, transparent); color: var(--fail); }
.navfoot { margin-top: auto; padding-top: 12px; }
.collapse { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 9px 10px; border: 0; background: none; color: var(--muted); border-radius: 9px; cursor: pointer; font-size: 14px; min-height: 40px; }
.collapse:hover { background: var(--raised); color: var(--ink); }
.app.collapsed .lbl, .app.collapsed .grp, .app.collapsed .brand-t, .app.collapsed nav.side .count { display: none; }
.app.collapsed .grp-sep { display: block; }
.grp-sep { display: none; height: 1px; background: var(--line); margin: 10px 8px; }
.app.collapsed nav.side a, .app.collapsed .collapse { justify-content: center; padding: 10px 0; }
.app.collapsed .brand { justify-content: center; padding-inline: 0; }
.app.collapsed .collapse svg { transform: rotate(180deg); }
.app.collapsed nav.side a .dot { position: absolute; top: 7px; right: 12px; width: 8px; height: 8px; border-radius: 50%; background: var(--burgundy-ink); }
nav.side a .dot { display: none; }
.app.collapsed nav.side a .dot { display: block; }

main { min-width: 0; padding: max(20px, env(safe-area-inset-top, 0px)) max(var(--gut), env(safe-area-inset-right, 0px)) 72px var(--gut); }
.wrap { max-width: 1320px; margin: 0 auto; display: grid; gap: 40px; }
.top { display: flex; flex-wrap: wrap; gap: 14px 24px; justify-content: space-between; align-items: flex-end; }
.top > div:first-child { flex: 1 1 420px; min-width: 0; }
.top .sub { color: var(--muted); margin-top: 6px; font-size: 15px; }
.tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.fresh { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.fresh b { color: var(--ink); font-weight: 600; }
.fresh .pip { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.fresh.stale { border-color: color-mix(in srgb, var(--warn) 55%, transparent); color: var(--ink); }
.fresh.stale .pip { background: var(--warn); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--surface); }
.seg button { background: none; border: 0; color: var(--muted); font-size: 14px; padding: 7px 13px; cursor: pointer; min-height: 36px; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--raised); color: var(--ink); font-weight: 600; }
.iconbtn { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; }
.iconbtn:hover { color: var(--ink); border-color: var(--line-strong); }
.banner { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; color: var(--muted); }
.banner b { color: var(--ink); }
.banner.warn { border-color: color-mix(in srgb, var(--warn) 50%, transparent); }
.banner.warn svg { color: var(--warn); }

/* ===== Common blocks ===== */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; }
.btn { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--ink); background: var(--raised); border: 1px solid var(--line); border-radius: 9px; padding: 8px 14px; cursor: pointer; white-space: nowrap; min-height: 38px; text-decoration: none; }
.btn:hover:not(:disabled) { border-color: var(--line-strong); }
.btn.primary { background: var(--burgundy); border-color: var(--burgundy); color: var(--on-burgundy); }
.btn.primary:hover:not(:disabled) { background: var(--burgundy-hover); border-color: var(--burgundy-hover); }
.btn.ghost { background: none; }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn.lg { font-size: 15px; padding: 11px 18px; min-height: 44px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
.chip.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
.chip.fail { color: var(--fail); border-color: color-mix(in srgb, var(--fail) 40%, transparent); }
.chip.run { color: var(--royal); border-color: color-mix(in srgb, var(--royal) 40%, transparent); }
.tag { font-size: 11.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; border-radius: 5px; padding: 1px 6px; white-space: nowrap; }
.tag.m { color: var(--ok); border: 1px solid color-mix(in srgb, var(--ok) 50%, transparent); }
.tag.e { color: var(--muted); border: 1px dashed var(--muted); }
.list { display: grid; border-top: 1px solid var(--line); }
.list:empty { display: none; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; padding: 14px 0; border-bottom: 1px solid var(--line); align-items: center; }
.row .m { grid-column: 1 / -1; }
.stripe-row { grid-template-columns: 4px minmax(0, 1fr) auto; gap: 16px; }
.stripe { align-self: stretch; border-radius: 2px; background: var(--line-strong); }
.k-approval, .k-review { background: var(--royal); } .k-failure { background: var(--fail); } .k-decision { background: var(--warn); }
.empty { padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line-strong); border-radius: var(--r); display: grid; gap: 8px; justify-items: center; }
.empty b { color: var(--ink); font-size: 16px; }
.skel { display: grid; gap: 10px; }
.skel i { display: block; height: 14px; border-radius: 6px; background: var(--raised); }
.skel i:nth-child(2n) { width: 72%; } .skel i:nth-child(3n) { width: 48%; }
.skel.block i { height: 120px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 40px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.tech { display: none; font-family: var(--mono); font-size: 12.5px; color: var(--faint); word-break: break-all; }
body.technical .tech { display: block; }
body.technical span.tech { display: inline; }
.note { font-size: 14px; color: var(--muted); max-width: 72ch; }
.status { font-size: 13.5px; min-height: 1.4em; }
.status.saved { color: var(--ok); } .status.err { color: var(--fail); } .status.wait { color: var(--muted); }
textarea, input[type="search"], input[type="text"], select { background: var(--surface); color: var(--ink); border: 1px solid var(--line-strong); border-radius: 9px; padding: 9px 12px; font-size: 15px; min-height: 40px; }
textarea { width: 100%; min-height: 84px; resize: vertical; line-height: 1.5; }
textarea:disabled { opacity: .6; }
label.fl { display: grid; gap: 6px; font-size: 13.5px; color: var(--muted); font-weight: 600; }
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.search { position: relative; flex: 1 1 260px; max-width: 420px; }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--faint); }
.search input { width: 100%; padding-left: 38px; }
.bar { height: 8px; border-radius: 4px; background: var(--raised); overflow: hidden; }
.bar > i { display: block; height: 100%; width: var(--w); background: var(--ok); border-radius: 4px; }
.bar.royal > i { background: var(--royal); } .bar.ink > i { background: var(--muted); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 12.5px; color: var(--faint); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 8px 12px 8px 0; border-bottom: 1px solid var(--line); }
td { padding: 11px 12px 11px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.tscroll { overflow-x: auto; }
details > summary { cursor: pointer; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
.flash { outline: 2px solid var(--royal); outline-offset: 4px; }

/* ===== Overview ===== */
.nba { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px 28px; align-items: center; padding: 26px 28px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--burgundy-ink); box-shadow: var(--shadow); }
.nba .kick { font-size: 12.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--burgundy-ink); }
.nba h3 { font-size: 22px; margin-top: 6px; }
.nba .why { color: var(--muted); margin-top: 6px; max-width: 70ch; }
.nba-more { display: grid; margin-top: 4px; }
.nba-more .row { padding: 12px 0; }
.hero { display: grid; grid-template-columns: minmax(240px, 380px) minmax(0, 1fr); gap: 28px; padding: 0; overflow: hidden; }
.thumb { background: var(--sunken); align-self: stretch; min-height: 200px; display: grid; align-content: center; justify-items: center; gap: 8px; place-items: center; color: var(--muted); font-size: 13.5px; text-align: center; padding: 16px; position: relative; }
.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.hero .body { padding: 24px 28px 24px 0; display: grid; gap: 16px; align-content: start; }
.hero .name { font-size: 21px; font-weight: 600; line-height: 1.3; }
.steps { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 6px; list-style: none; margin: 0; padding: 0; }
.steps li { display: grid; gap: 7px; font-size: 12.5px; color: var(--muted); min-width: 0; }
.steps li::before { content: ""; height: 6px; border-radius: 3px; background: var(--line); }
.steps li.done::before { background: var(--ok); } .steps li.running::before { background: var(--royal); } .steps li.blocked::before { background: var(--fail); }
.steps li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.steps li.cur { color: var(--ink); font-weight: 700; }
.progress { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; }
.progress .big { font-size: 28px; font-weight: 600; }
.nextreq { display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 14px 16px; border-radius: 10px; background: var(--raised); }
.nextreq .l { font-size: 12.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
.qtiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.qtile { display: grid; gap: 2px; padding: 14px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); text-decoration: none; color: var(--ink); }
.qtile:hover { border-color: var(--line-strong); }
.qtile .v { font-size: 26px; font-weight: 600; }
.qtile .k { font-size: 13px; color: var(--muted); }

/* ===== Courses ===== */
.kanban { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(220px, 1fr); gap: 14px; overflow-x: auto; padding-bottom: 8px; }
.col { background: var(--sunken); border-radius: var(--r); padding: 12px; display: grid; gap: 10px; align-content: start; min-height: 140px; }
.col h4 { margin: 0 4px 2px; font-size: 13px; font-weight: 700; color: var(--muted); display: flex; justify-content: space-between; }
.lcard { display: grid; gap: 8px; padding: 14px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); text-decoration: none; color: var(--ink); }
.lcard:hover { border-color: var(--line-strong); }

/* ===== Lesson ===== */
.chap { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.chap + .chap { margin-top: 10px; }
.chap > summary { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 18px; }
.chap > summary .n { font-size: 13px; font-weight: 700; color: var(--faint); }
.chap > summary:hover { background: var(--raised); border-radius: var(--r); }
.chap[open] > summary { border-bottom: 1px solid var(--line); border-radius: var(--r) var(--r) 0 0; }
.chap .inner { padding: 6px 18px 14px; }
.narr { color: var(--muted); max-width: 60ch; }

/* ===== Review Centre ===== */
.rv-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
.rv-head label.fl select { min-width: 150px; }
.rv { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 28px; align-items: start; }
.players { display: grid; gap: 12px; }
.players.cmp { grid-template-columns: 1fr 1fr; }
.pl { position: relative; background: var(--video); border-radius: 12px; overflow: hidden; aspect-ratio: 16/9; border: 1px solid var(--line); }
.pl video { width: 100%; height: 100%; display: block; background: var(--video); }
.pl .vlabel { position: absolute; left: 10px; top: 10px; font-size: 12.5px; font-weight: 700; color: var(--on-video); background: var(--scrim); padding: 3px 9px; border-radius: 6px; }
.pl .vmsg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--on-video); text-align: center; padding: 24px; font-size: 14px; background: var(--scrim); }
.pl .vmsg[hidden] { display: none; }
.abtoggle { display: none; }
.players.ab .abtoggle { display: inline-flex; }
.players.ab { grid-template-columns: 1fr; }
.players.ab .pl.off { display: none; }
.transport { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.play { width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--burgundy); color: var(--on-burgundy); display: grid; place-items: center; cursor: pointer; }
.play:hover { background: var(--burgundy-hover); }
.play svg { width: 22px; height: 22px; }
.tcbig { font-family: var(--mono); font-size: 22px; font-weight: 500; letter-spacing: -.01em; }
.tcbig small { font-size: 14px; color: var(--muted); }
.tgroup { display: inline-flex; gap: 4px; }
.speed select { min-height: 38px; padding: 6px 10px; font-size: 14px; }
.scrub { position: relative; height: 64px; touch-action: none; cursor: pointer; user-select: none; }
.scrub .lane { position: absolute; left: 0; right: 0; }
.scrub .track { position: absolute; left: 0; right: 0; top: 34px; height: 8px; border-radius: 4px; background: var(--raised); }
.scrub .played { position: absolute; left: 0; top: 34px; height: 8px; border-radius: 4px; background: var(--burgundy-ink); width: 0; }
.scrub .head { position: absolute; top: 28px; width: 16px; height: 20px; margin-left: -8px; border-radius: 5px; background: var(--ink); box-shadow: var(--shadow); }
.scrub:focus-visible { outline-offset: 4px; }
.mk { position: absolute; transform: translateX(-50%); border: 0; padding: 0; background: none; cursor: pointer; display: grid; place-items: center; }
.mk.sc { top: 26px; height: 24px; width: 12px; }
.mk.sc::after { content: ""; width: 2px; height: 24px; background: var(--muted); border-radius: 1px; opacity: .8; }
.mk.qa { top: 4px; width: 18px; height: 18px; }
.mk.qa::after { content: ""; width: 10px; height: 10px; background: var(--warn); transform: rotate(45deg); border-radius: 2px; }
.mk.qa.f::after { background: var(--fail); }
.mk.cm { top: 4px; width: 18px; height: 18px; }
.mk.cm::after { content: ""; width: 11px; height: 11px; border-radius: 50%; background: var(--royal); }
.mk:hover::after, .mk:focus-visible::after { transform: scale(1.3); }
.mk.qa:hover::after { transform: rotate(45deg) scale(1.3); }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: -1px; border-radius: 2px; }
.nowscene { display: grid; gap: 4px; padding: 14px 16px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); }

<script>

/* ================= Data: subscriptions ================= */
function subscribe() {

/* ================= Writes (comments / approvals / requests) ================= */
function writeBlock() {

  if (!S.uid) return "Sign in to comment, approve or send requests. You can still watch and read everything.";
  if (S.canW === false) return "You have view-only access. Ask the studio owner for Contributor access to comment, approve or send requests.";

async function write(coll, body, statusEl) {

}
window.addEventListener("hashchange", () => render());
setInterval(() => { const f = document.getElementById("fresh"); if (f) f.replaceWith(freshness()); }, 30000);

/* ================= Boot ================= */
(async function init() {
  const t = lsGet("ll.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  if (lsGet("ll.nav") === "collapsed") document.getElementById("app").classList.add("collapsed");
  document.body.classList.toggle("technical", S.mode === "technical");
  render();
  try { S.db = (await window.claude?.use?.("db")) || null; } catch (e) { S.db = null; }
  try { S.user = (await window.claude?.use?.("user")) || null; } catch (e) { S.user = null; }
  if (S.user) {
    try { S.uid = await S.user.id(); } catch (e) { S.uid = null; }
    try { S.canW = await S.user.can("data.write"); } catch (e) { S.canW = null; }
  }
  if (!S.db) { S.noDb = true; SOURCES.forEach((s) => S.loaded.add(s)); }
  else subscribe();
  render(true);
  setTimeout(() => { if (S.loaded.size < SOURCES.length) { S.slow = true; invalidate(); } }, 10000);
})();
</script>
